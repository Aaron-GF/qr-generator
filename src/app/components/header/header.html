<header class="flex justify-between items-center max-w-7xl mx-auto mb-8 lg:mb-12">
  <div class="flex items-center gap-3 group cursor-pointer">
    <img src="/images/QRakin.svg" width="100" alt="logo de qrakin">
    <h1 class="text-3xl font-bold tracking-tight text-text">
      QRakin<span class="text-primary">.</span>
    </h1>
  </div>

  <button
    (click)="toggleTheme()"
    class="p-2.5 rounded-full bg-secondary/10 hover:bg-secondary/20 text-secondary transition-colors"
    [title]="isDarkMode() ? 'Modo claro' : 'Modo oscuro'"
  >
    @if (isDarkMode()) {
      <!-- prettier-ignore -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-6 h-6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    } @else {
      <!-- prettier-ignore -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-6 h-6" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg>
    }
  </button>
</header>
