<!-- Personalización Visual -->
<div class="bg-background rounded-2xl border border-secondary/20 shadow-sm p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="font-semibold text-lg flex items-center gap-2">Diseño del QR</h2>
    <div class="flex items-center gap-1.5 text-xs text-text/60">
      <span>Predefinido</span>
      <button
        type="button"
        (click)="applyPreset('#05241e', '#ffffff')"
        class="size-5 rounded-full outline outline-secondary/30 shadow-xs hover:scale-110 transition-transform bg-[linear-gradient(135deg,#05241e_50%,#ffffff_50%)]"
        title="Clásico"
      ></button>
      <button
        type="button"
        (click)="applyPreset('#113783', '#f0f5ff')"
        class="size-5 rounded-full outline outline-secondary/30 shadow-xs hover:scale-110 transition-transform bg-[linear-gradient(135deg,#113783_50%,#f0f5ff_50%)]"
        title="Océano"
      ></button>
      <button
        type="button"
        (click)="applyPreset('#053b2f', '#dbfaf4')"
        class="size-5 rounded-full outline outline-secondary/30 shadow-xs hover:scale-110 transition-transform bg-[linear-gradient(135deg,#053b2f_50%,#dbfaf4_50%)]"
        title="Menta"
      ></button>
      <button
        type="button"
        (click)="applyPreset('#3b0764', '#fdf4ff')"
        class="size-5 rounded-full outline outline-secondary/30 shadow-xs hover:scale-110 transition-transform bg-[linear-gradient(135deg,#3b0764_50%,#fdf4ff_50%)]"
        title="Púrpura"
      ></button>
    </div>
  </div>

  <div class="space-y-6">
    <!-- Colores -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-2">Color Tinta</label>
        <div class="flex items-center gap-3">
          <label
            class="relative w-10 h-10 rounded-lg shadow-inner cursor-pointer border border-secondary/20 flex items-center justify-center overflow-hidden shrink-0"
            [style.background-color]="design.colorDark"
          >
            <input
              type="color"
              class="opacity-0 absolute inset-0 cursor-pointer w-full h-full"
              [value]="design.colorDark"
              (input)="setColorDark($any($event.target).value)"
            />
          </label>
          <input
            type="text"
            [value]="design.colorDark"
            (input)="setColorDark($any($event.target).value)"
            class="flex-1 px-3 py-2 rounded-lg bg-secondary/5 border border-secondary/20 text-sm font-mono focus:border-primary outline-none"
            placeholder="#000000"
          />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-2">Color Fondo</label>
        <div class="flex items-center gap-3">
          <label
            class="relative w-10 h-10 rounded-lg shadow-inner cursor-pointer border border-secondary/30 flex items-center justify-center overflow-hidden shrink-0"
            [style.background-color]="design.colorLight"
          >
            <input
              type="color"
              class="opacity-0 absolute inset-0 cursor-pointer w-full h-full"
              [value]="design.colorLight"
              (input)="setColorLight($any($event.target).value)"
            />
          </label>
          <input
            type="text"
            [value]="design.colorLight"
            (input)="setColorLight($any($event.target).value)"
            class="flex-1 px-3 py-2 rounded-lg bg-secondary/5 border border-secondary/20 text-sm font-mono focus:border-primary outline-none"
            placeholder="#ffffff"
          />
        </div>
      </div>
    </div>

    <!-- Forma -->
    <div>
      <label class="block text-sm font-medium mb-3">Forma de los píxeles</label>
      <div class="flex gap-3">
        <button
          type="button"
          (click)="setPixelShape('squares')"
          [class]="
            'flex-1 py-2 px-3 border-2 rounded-xl font-medium text-sm transition-all ' +
            (design.pixelShape === 'squares'
              ? 'border-primary text-primary bg-primary/10 shadow-sm'
              : 'border-transparent hover:border-secondary/30 text-text/70 bg-secondary/5')
          "
        >
          Cuadrados
        </button>
        <button
          type="button"
          (click)="setPixelShape('rounded')"
          [class]="
            'flex-1 py-2 px-3 border-2 rounded-xl font-medium text-sm transition-all ' +
            (design.pixelShape === 'rounded'
              ? 'border-primary text-primary bg-primary/10 shadow-sm'
              : 'border-transparent hover:border-secondary/30 text-text/70 bg-secondary/5')
          "
        >
          Redondeados
        </button>
        <button
          type="button"
          (click)="setPixelShape('dots')"
          [class]="
            'flex-1 py-2 px-3 border-2 rounded-xl font-medium text-sm transition-all ' +
            (design.pixelShape === 'dots'
              ? 'border-primary text-primary bg-primary/10 shadow-sm'
              : 'border-transparent hover:border-secondary/30 text-text/70 bg-secondary/5')
          "
        >
          Puntos
        </button>
      </div>
    </div>

    <!-- Logo -->
    <div>
      <label class="block text-sm font-medium mb-3">Logo Central</label>
      @if (!design.logo) {
        <label
          class="border-2 border-dashed border-secondary/30 rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-secondary/5 hover:border-primary/50 transition-all group"
          (dragover)="onDragOver($event)"
          (drop)="onDrop($event)"
        >
          <input
            type="file"
            accept="image/png, image/jpeg, image/svg+xml, image/webp"
            class="hidden"
            (change)="onLogoSelected($event)"
          />
          <div
            class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"
          >
            <!-- prettier-ignore -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-5 h-5 text-text" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m14-7-5-5-5 5m5-5v12"/></svg>
          </div>
          <p class="text-sm font-medium">Sube una imagen</p>
          <p class="text-xs text-text/50 mt-1">PNG, JPG, SVG o WebP hasta 2MB</p>
        </label>
      } @else {
        <div
          class="border border-secondary/20 bg-secondary/5 rounded-xl p-4 flex items-center justify-between gap-4"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-14 h-14 rounded-lg bg-background p-1.5 border border-secondary/20 shadow-xs flex items-center justify-center overflow-hidden"
            >
              <img [src]="design.logo" alt="Logo central" class="w-full h-full object-contain" />
            </div>
            <div>
              <p class="text-sm font-medium">Logo configurado</p>
              <p class="text-xs text-success flex items-center gap-1 mt-0.5">
                <span class="w-1.5 h-1.5 rounded-full bg-success"></span>
                Corrección alta (H) activa
              </p>
            </div>
          </div>
          <button
            type="button"
            (click)="removeLogo($event)"
            class="px-3 py-1.5 rounded-lg text-xs font-medium bg-danger/10 text-danger hover:bg-danger/20 transition-colors"
          >
            Quitar logo
          </button>
        </div>
      }
    </div>

    <!-- Sliders -->
    <div>
      <div class="flex justify-between mb-1.5">
        <label class="text-sm font-medium">Margen (Padding)</label>
        <span class="text-xs text-text/60 font-mono">{{ design.margin }} bloques</span>
      </div>
      <input
        type="range"
        class="w-full h-2 bg-secondary/20 rounded-lg appearance-none cursor-pointer accent-primary"
        min="0"
        max="4"
        step="1"
        [value]="design.margin"
        (input)="setMargin($event)"
      />
    </div>
  </div>
</div>
