<!-- Selector de Datos -->
<div class="bg-background rounded-2xl border border-secondary/20 shadow-sm p-6">
  <h2 class="font-semibold text-lg mb-4">¿Qué quieres generar?</h2>
  <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-6">
    <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-primary text-background font-medium shadow-md transition-transform active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
      <span class="text-xs">URL</span>
    </button>
    <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7" /></svg>
      <span class="text-xs">Texto</span>
    </button>
    <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" /></svg>
      <span class="text-xs">Wi-Fi</span>
    </button>
    <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 011.789 1.106l1.5 3M14 10h5.236a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.018a2 2 0 01-1.789-1.106l-1.5-3" /></svg>
      <span class="text-xs">vCard</span>
    </button>
    <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      <span class="text-xs">Email</span>
    </button>
  </div>

  <!-- Input Area (Ejemplo URL) -->
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1.5">Introduce el enlace</label>
      <input type="text" placeholder="https://tu-sitio-web.com" class="w-full px-4 py-3 rounded-xl bg-background border border-secondary/30 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text/40">
    </div>
  </div>
</div>
