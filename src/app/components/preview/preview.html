<div class="lg:col-span-4 space-y-6 order-2 lg:order-3">
  <!-- Preview Box -->
  <div
    class="bg-background rounded-2xl border border-secondary/20 shadow-xl shadow-primary/5 p-6 flex flex-col items-center relative overflow-hidden"

    <h3 class="font-bold text-lg mb-6 w-full text-left">Vista Previa</h3>

    <!-- Mock de QR -->
    <div
      class="w-64 h-64 bg-white rounded-xl shadow-sm border border-secondary/10 flex items-center justify-center p-4 relative mb-6 transition-all duration-300"
    >
      <!-- Placeholder visual de QR (puedes reemplazar con el canvas/img real luego) -->
      <div
        class="w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPgo8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ3aGl0ZSIvPgo8cGF0aCBkPSJNMCAwaDQwdjQwaC00MHptMTAgMTBoMjB2MjBoLTIwem0tMTAgNjBoNDB2NDBoLTQwem0xMCAxMGgyMHYyMGgtMjB6bTYwLTYwaDQwdjQwaC00MHptMTAgMTBoMjB2MjBoLTIwIiBmaWxsPSIjMDUyNDFlIi8+Cjwvc3ZnPg==')] bg-cover opacity-20"
      ></div>

      <div class="absolute inset-0 flex items-center justify-center">
        <span class="bg-background/80 backdrop-blur px-4 py-2 rounded-full text-sm font-medium"
          >QR Dinámico</span
        >
      </div>
    </div>

    <!-- Acciones de Exportación -->
    <div class="w-full space-y-3">
      <button
        class="w-full py-3.5 px-4 bg-primary hover:bg-primary/90 text-background font-bold rounded-xl shadow-lg shadow-primary/30 transition-all flex justify-center items-center gap-2 transform active:scale-95"
      >
        <!-- prettier-ignore -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-5 h-5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
        Descargar PNG
      </button>

      <div class="grid grid-cols-2 gap-3">
        <button
          class="py-2.5 px-4 bg-secondary/10 hover:bg-secondary/20 text-text font-medium rounded-xl transition-colors flex justify-center items-center gap-2 text-sm"
        >
          <!-- prettier-ignore -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-5 h-5" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copiar
        </button>
        <button
          class="py-2.5 px-4 bg-secondary/10 hover:bg-secondary/20 text-text font-medium rounded-xl transition-colors flex justify-center items-center gap-2 text-sm"
        >
          Descargar SVG
        </button>
      </div>
    </div>
  </div>

  <!-- Quick Share (API Web Share mock) -->
  <button
    class="w-full py-4 px-6 bg-background border border-secondary/20 hover:border-primary/50 rounded-2xl flex items-center justify-between group transition-colors shadow-sm"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 bg-accent/10 text-accent rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
          />
        </svg>
      </div>
      <div class="text-left">
        <p class="font-semibold text-sm">Compartir rápido</p>
        <p class="text-xs text-text/60">Enviar enlace a otra app</p>
      </div>
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5 text-secondary/50 group-hover:text-primary transition-colors"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M9 5l7 7-7 7" />
    </svg>
  </button>
</div>
