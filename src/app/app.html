<div class="min-h-screen p-4 md:p-8 font-sans transition-colors duration-300 relative">
  <app-header
    [isDarkMode]="isDarkMode()"
    (themeToggle)="toggleTheme()"
    class="contents"
  ></app-header>
  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    <app-history class="contents"></app-history>
    <div class="lg:col-span-5 space-y-6 order-1 lg:order-2">
      <app-configurator class="contents"></app-configurator>
      <app-design class="contents"></app-design>
    </div>
    <app-preview class="contents"></app-preview>
  </main>

  <!-- Notificación Toast flotante -->
  @if (qrService.toast(); as toast) {
    <div
      class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-md transition-all duration-300 animate-bounce-subtle"
      [class.bg-background]="true"
      [class.border-success/40]="toast.type === 'success'"
      [class.border-primary/40]="toast.type === 'info'"
      [class.border-danger/40]="toast.type === 'error'"
    >
      @if (toast.type === 'success') {
        <span class="w-2.5 h-2.5 rounded-full bg-success"></span>
      } @else if (toast.type === 'error') {
        <span class="w-2.5 h-2.5 rounded-full bg-danger"></span>
      } @else {
        <span class="w-2.5 h-2.5 rounded-full bg-primary"></span>
      }
      <p class="text-sm font-medium text-text">{{ toast.message }}</p>
    </div>
  }
</div>
