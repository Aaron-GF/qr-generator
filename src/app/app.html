<div class="min-h-screen p-4 md:p-8 font-sans transition-colors duration-300">
  <!-- HEADER -->
  <header class="flex justify-between items-center max-w-7xl mx-auto mb-8 lg:mb-12">
    <div class="flex items-center gap-3 group cursor-pointer">
      <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/30 transform group-hover:scale-105 transition-all">
        <!-- Icono pulpo simulado -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-background" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C9.23858 2 7 4.23858 7 7V9C7 11.7614 9.23858 14 12 14C14.7614 14 17 11.7614 17 9V7C17 4.23858 14.7614 2 12 2Z" />
          <path d="M4.5 13.5C3.11929 13.5 2 14.6193 2 16C2 17.3807 3.11929 18.5 4.5 18.5C5.88071 18.5 7 17.3807 7 16" />
          <path d="M19.5 13.5C18.1193 13.5 17 14.6193 17 16C17 17.3807 18.1193 18.5 19.5 18.5C20.8807 18.5 22 17.3807 22 16" />
          <path d="M9.5 14C8.11929 14 7 15.1193 7 16.5C7 17.8807 8.11929 19 9.5 19" />
          <path d="M14.5 14C15.8807 14 17 15.1193 17 16.5C17 17.8807 15.8807 19 14.5 19" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-text">QRakin<span class="text-primary">.</span></h1>
    </div>
    
    <button class="p-2.5 rounded-full bg-secondary/10 hover:bg-secondary/20 text-secondary transition-colors" title="Cambiar tema">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </button>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- LEFT SIDEBAR: HISTORIAL Y CATEGORÍAS (Funcionalidad 3) -->
    <aside class="lg:col-span-3 space-y-6 order-3 lg:order-1">
      <div class="bg-background rounded-2xl border border-secondary/20 shadow-sm overflow-hidden flex flex-col h-full">
        <div class="p-5 border-b border-secondary/20">
          <h2 class="font-semibold text-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            Historial local
          </h2>
        </div>
        <div class="p-4 flex-1 space-y-3">
          <!-- Ejemplo de item guardado -->
          <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-secondary/5 cursor-pointer transition-colors group">
            <div class="w-10 h-10 bg-secondary/10 rounded-lg flex items-center justify-center shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
            </div>
            <div class="flex-1 overflow-hidden">
              <p class="text-sm font-medium truncate">Mi Portfolio</p>
              <p class="text-xs text-text/60 truncate">Enlace URL</p>
            </div>
            <button class="text-text/40 hover:text-warning transition-colors opacity-0 group-hover:opacity-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
            </button>
          </div>
          <!-- Item WiFi -->
          <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-secondary/5 cursor-pointer transition-colors group">
            <div class="w-10 h-10 bg-success/10 rounded-lg flex items-center justify-center shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" /></svg>
            </div>
            <div class="flex-1 overflow-hidden">
              <p class="text-sm font-medium truncate">Wi-Fi Casa</p>
              <p class="text-xs text-text/60 truncate">Red de Invitados</p>
            </div>
          </div>
        </div>
        <div class="p-4 border-t border-secondary/20">
          <button class="w-full text-sm text-center text-text/60 hover:text-primary transition-colors">Ver todo el historial</button>
        </div>
      </div>
    </aside>

    <!-- CENTER: CONFIGURACIÓN (Funcionalidad 1) -->
    <div class="lg:col-span-5 space-y-6 order-1 lg:order-2">
      
      <!-- Selector de Datos -->
      <div class="bg-background rounded-2xl border border-secondary/20 shadow-sm p-6">
        <h2 class="font-semibold text-lg mb-4">¿Qué quieres generar?</h2>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-6">
          <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-primary text-background font-medium shadow-md transition-transform active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
            <span class="text-xs">URL</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7" /></svg>
            <span class="text-xs">Texto</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" /></svg>
            <span class="text-xs">Wi-Fi</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 011.789 1.106l1.5 3M14 10h5.236a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.018a2 2 0 01-1.789-1.106l-1.5-3" /></svg>
            <span class="text-xs">vCard</span>
          </button>
          <button class="flex flex-col items-center justify-center p-3 rounded-xl bg-secondary/5 hover:bg-secondary/15 text-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mb-1 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            <span class="text-xs">Email</span>
          </button>
        </div>

        <!-- Input Area (Ejemplo URL) -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Introduce el enlace</label>
            <input type="text" placeholder="https://tu-sitio-web.com" class="w-full px-4 py-3 rounded-xl bg-background border border-secondary/30 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text/40">
          </div>
        </div>
      </div>

      <!-- Personalización Visual -->
      <div class="bg-background rounded-2xl border border-secondary/20 shadow-sm p-6">
        <h2 class="font-semibold text-lg mb-6 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>
          Diseño del QR
        </h2>
        
        <div class="space-y-6">
          <!-- Colores -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-2">Color Tinta</label>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-text shadow-inner cursor-pointer border border-secondary/20"></div>
                <input type="text" value="#05241e" class="flex-1 px-3 py-2 rounded-lg bg-secondary/5 border border-secondary/20 text-sm font-mono focus:border-primary outline-none">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Color Fondo</label>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-background shadow-inner cursor-pointer border border-secondary/30"></div>
                <input type="text" value="#ffffff" class="flex-1 px-3 py-2 rounded-lg bg-secondary/5 border border-secondary/20 text-sm font-mono focus:border-primary outline-none">
              </div>
            </div>
          </div>

          <!-- Forma -->
          <div>
            <label class="block text-sm font-medium mb-3">Forma de los píxeles</label>
            <div class="flex gap-3">
              <button class="flex-1 py-2 px-3 border-2 border-primary rounded-xl font-medium text-sm text-primary bg-primary/5">Cuadrados</button>
              <button class="flex-1 py-2 px-3 border-2 border-transparent hover:border-secondary/30 rounded-xl font-medium text-sm text-text/70 bg-secondary/5 transition-colors">Redondeados</button>
              <button class="flex-1 py-2 px-3 border-2 border-transparent hover:border-secondary/30 rounded-xl font-medium text-sm text-text/70 bg-secondary/5 transition-colors">Puntos</button>
            </div>
          </div>

          <!-- Logo -->
          <div>
            <label class="block text-sm font-medium mb-3">Logo Central</label>
            <div class="border-2 border-dashed border-secondary/30 rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-secondary/5 transition-colors group">
              <div class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
              </div>
              <p class="text-sm font-medium">Sube una imagen</p>
              <p class="text-xs text-text/50 mt-1">PNG, JPG hasta 2MB</p>
            </div>
          </div>

          <!-- Sliders -->
          <div>
            <div class="flex justify-between mb-1">
              <label class="text-sm font-medium">Margen (Padding)</label>
              <span class="text-xs text-text/50 font-mono">2 blocks</span>
            </div>
            <input type="range" class="w-full h-2 bg-secondary/20 rounded-lg appearance-none cursor-pointer accent-primary" min="0" max="4" value="2">
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: PREVIEW & EXPORT (Funcionalidades 2 y 4) -->
    <div class="lg:col-span-4 space-y-6 order-2 lg:order-3">
      
      <!-- Preview Box -->
      <div class="bg-background rounded-2xl border border-secondary/20 shadow-xl shadow-primary/5 p-6 flex flex-col items-center relative overflow-hidden">
        
        <!-- Mascota Animada (Estado) -->
        <div class="absolute -top-4 -right-4 w-24 h-24 bg-accent/10 rounded-full blur-2xl"></div>
        <div class="absolute top-4 right-4 text-accent animate-pulse">
           <!-- Representación simple de la mascota en reposo/ok -->
           <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>

        <h3 class="font-bold text-lg mb-6 w-full text-left">Vista Previa</h3>
        
        <!-- Mock de QR -->
        <div class="w-64 h-64 bg-white rounded-xl shadow-sm border border-secondary/10 flex items-center justify-center p-4 relative mb-6 transition-all duration-300">
           <!-- Placeholder visual de QR (puedes reemplazar con el canvas/img real luego) -->
           <div class="w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPgo8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ3aGl0ZSIvPgo8cGF0aCBkPSJNMCAwaDQwdjQwaC00MHptMTAgMTBoMjB2MjBoLTIwem0tMTAgNjBoNDB2NDBoLTQwem0xMCAxMGgyMHYyMGgtMjB6bTYwLTYwaDQwdjQwaC00MHptMTAgMTBoMjB2MjBoLTIwIiBmaWxsPSIjMDUyNDFlIi8+Cjwvc3ZnPg==')] bg-cover opacity-20"></div>
           
           <div class="absolute inset-0 flex items-center justify-center">
             <span class="bg-background/80 backdrop-blur px-4 py-2 rounded-full text-sm font-medium">QR Dinámico</span>
           </div>
        </div>

        <!-- Acciones de Exportación -->
        <div class="w-full space-y-3">
          <button class="w-full py-3.5 px-4 bg-primary hover:bg-primary/90 text-background font-bold rounded-xl shadow-lg shadow-primary/30 transition-all flex justify-center items-center gap-2 transform active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            Descargar PNG
          </button>
          
          <div class="grid grid-cols-2 gap-3">
            <button class="py-2.5 px-4 bg-secondary/10 hover:bg-secondary/20 text-text font-medium rounded-xl transition-colors flex justify-center items-center gap-2 text-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
              Copiar
            </button>
            <button class="py-2.5 px-4 bg-secondary/10 hover:bg-secondary/20 text-text font-medium rounded-xl transition-colors flex justify-center items-center gap-2 text-sm">
              SVG / Vector
            </button>
          </div>
        </div>
      </div>

      <!-- Quick Share (API Web Share mock) -->
      <button class="w-full py-4 px-6 bg-background border border-secondary/20 hover:border-primary/50 rounded-2xl flex items-center justify-between group transition-colors shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-accent/10 text-accent rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
          </div>
          <div class="text-left">
            <p class="font-semibold text-sm">Compartir rápido</p>
            <p class="text-xs text-text/60">Enviar enlace a otra app</p>
          </div>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-secondary/50 group-hover:text-primary transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7" /></svg>
      </button>

    </div>
  </main>
</div>
